[project]
name = "vollo-model-zoo"
# Bump on any change that moves the benchmarks; see AGENTS.md.
version = "0.8.0"
description = "Exemplar models for the Vollo SDK "
readme = "README.md"
requires-python = ">=3.13"
# Every dependency has a floor, and CI tests the suite at all of them; see
# "Minimum versions" in AGENTS.md. Raise the Vollo pair together.
dependencies = [
  "vollo-compiler>=29.0.0",
  "vollo-torch>=29.0.0",
  "beartype>=0.19.0",
  "torch>=2.5.0",
  "matplotlib>=3.9.2",
  "pandas>=2.2.3",
  "tqdm>=4.66.0",
  "packaging>=24.0",
  "numpy>=2.1.0",
  "tabulate>=0.9.0",
]

[project.scripts]
zoo = "vollo_model_zoo.zoo:main"
benchmark = "vollo_model_zoo.benchmark:main"
plot = "vollo_model_zoo.plot:main"
report = "vollo_model_zoo.report:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["vollo_model_zoo*"]

[tool.isort]
# Keep isort from fighting black over how to wrap a long import.
profile = "black"

[tool.pytest.ini_options]
addopts = "-v"

[dependency-groups]
dev = [
  "flash-linear-attention>=0.4.1",
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "ruff>=0.17.4",
  # Unpickles the nanochat tokenizer that `test_nano_llm.py`'s checkpoint tests
  # decode with. Only reachable when the internal checkpoint mount is present.
  "tiktoken>=0.12.0",
  "ty>=0.0.101",
]

[tool.ruff.lint]
ignore = [
  "C408",  # dict(...) calls: the zoo writes SIZES and meta with them
  "UP045", # Optional[X]: the zoo's style, not X | None
]
