[project]
name = "vollo-model-zoo"
# Bump on any change that moves the benchmarks; see AGENTS.md.
version = "0.2.0"
description = "Exemplar models for the Vollo SDK "
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "vollo-compiler",
  "vollo-torch",
  "beartype",
  "torch",
  "matplotlib",
  "pandas",
  "tqdm",
  "packaging",
  "numpy",
]

[project.scripts]
zoo = "vollo_model_zoo.zoo:main"
benchmark = "vollo_model_zoo.benchmark:main"
plot = "vollo_model_zoo.plot:main"
report = "vollo_model_zoo.report:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["vollo_model_zoo*"]

[tool.isort]
# Keep isort from fighting black over how to wrap a long import.
profile = "black"

[tool.pytest.ini_options]
addopts = "-v"

[dependency-groups]
dev = ["flash-linear-attention>=0.4.1", "pre-commit>=4.5.1", "pytest>=9.0.2"]
