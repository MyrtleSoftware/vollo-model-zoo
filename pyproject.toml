[project]
name = "vollo-model-zoo"
# Bump on any change that moves the benchmarks; see AGENTS.md.
version = "0.8.0"
description = "Exemplar models for the Vollo SDK "
readme = "README.md"
requires-python = ">=3.13"

# Every dependency, groups included, has a floor that CI tests; see "Minimum
# versions" in AGENTS.md. Raise the Vollo pair together.
#
# Only what `zoo` needs is here.
dependencies = [
  "vollo-compiler>=29.0.0",
  "vollo-torch>=29.0.0",
  "beartype>=0.19.0",
  "tabulate>=0.9.0",
  "torch>=2.6.0",
]

[project.scripts]
zoo = "vollo_model_zoo.zoo:main"
benchmark = "vollo_model_zoo.benchmark:main"
plot = "vollo_model_zoo.plot:main"
report = "vollo_model_zoo.report:main"

[tool.uv]
package = true
# No group by default, so customers' `uv run zoo` gets the runtime alone. Devs
# take every group (`.envrc` does: `layout uv --all-groups`), and CI takes what
# each job needs.
default-groups = []

[tool.setuptools.packages.find]
include = ["vollo_model_zoo*"]

[tool.pytest.ini_options]
addopts = "-v"

[dependency-groups]
# The `benchmark`, `plot` and `report` commands: the weekly benchmark workflow.
benchmarks = [
  "matplotlib>=3.9.2",
  "packaging>=24.0",
  "pandas>=2.2.3",
  "tqdm>=4.66.0",
]
test = [
  # Reference implementations for the mamba1/mamba2/nano-llm equivalence tests.
  "flash-linear-attention>=0.4.2",
  "numpy>=2.1.0",
  "packaging>=24.0",
  "pytest>=9.0.2",
  # Unpickles the nanochat tokenizer that `test_nano_llm.py`'s checkpoint tests
  # decode with. Only reachable when the internal checkpoint mount is present.
  "tiktoken>=0.12.0",
]
# Lint and editor tooling.
dev = [
  "pre-commit>=4.5.1",
  "ruff>=0.17.4",
  "ty>=0.0.101",
]

[tool.ruff]
# Markdown code blocks are hand-aligned for reading; leave them be.
extend-exclude = ["*.md"]

[tool.ruff.lint]
ignore = [
  "C408",   # dict(...) calls: the zoo writes SIZES and meta with them
  "PYI041", # int | float: beartype rejects an int for a bare float
  "UP045",  # Optional[X]: the zoo's style, not X | None
]

[tool.ruff.lint.per-file-ignores]
# A model's filename is its CLI name, hyphens included.
"vollo_model_zoo/models/*.py" = ["N999"]
