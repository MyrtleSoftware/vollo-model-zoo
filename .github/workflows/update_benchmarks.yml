name: Update Benchmarks

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  update-benchmarks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Upgrade Vollo to the latest release
        run: |
          # The compiler and VM come from PyPI, so upgrading the lock is all it
          # takes to benchmark a new SDK -- and committing that lock is what
          # gives `uv run zoo` users the latest Vollo. Only the two Vollo
          # packages are upgraded: a torch bump would move the numbers for
          # reasons that have nothing to do with the SDK release.
          uv lock --upgrade-package vollo-compiler --upgrade-package vollo-torch

      - name: Follow the lock with the declared floor
        run: |
          # The zoo declares the SDK it is actually tested and benchmarked
          # against, rather than an older version nobody checks, so the floor
          # tracks the lock. `tests/test_version.py` asserts the two agree, and
          # `uv.lock` records the specifier as well as the resolved version --
          # hence the re-lock.
          python3 - <<'PY'
          import pathlib, re, tomllib

          lock = tomllib.loads(pathlib.Path("uv.lock").read_text())
          sdk = next(p["version"] for p in lock["package"] if p["name"] == "vollo-compiler")

          pyproject = pathlib.Path("pyproject.toml")
          pyproject.write_text(
              re.sub(
                  r'"vollo-(compiler|torch)>=[^"]+"',
                  lambda m: f'"vollo-{m.group(1)}>={sdk}"',
                  pyproject.read_text(),
              )
          )
          print(f"declared floor is now vollo >= {sdk}")
          PY

          uv lock

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check versions
        run: uv pip list

      - name: Resolve benchmark identity
        id: identity
        run: |
          # A benchmark run is identified by the SDK it measures *and* the zoo
          # version that defined the models, so a zoo-only change is not
          # mistaken for a run we already have. Ask the installed package
          # rather than rebuilding the string here, so there is one definition
          # of it (vollo_model_zoo/version.py).
          SDK=$(uv run --no-sync python -c 'from vollo_model_zoo.version import vollo_version; print(vollo_version())')
          ZOO=$(uv run --no-sync python -c 'from vollo_model_zoo.version import zoo_version; print(zoo_version())')
          VERSION=$(uv run --no-sync python -c 'from vollo_model_zoo.version import benchmark_version; print(benchmark_version())')

          echo "sdk=${SDK}" >> $GITHUB_OUTPUT
          echo "zoo=${ZOO}" >> $GITHUB_OUTPUT
          echo "file=benchmarks/vollo_${VERSION}.json" >> $GITHUB_OUTPUT
          echo "benchmarking Vollo SDK ${SDK} with model zoo ${ZOO}"

      - name: Check if benchmark already exists
        id: check-version
        run: |
          BENCHMARK_FILE="${{ steps.identity.outputs.file }}"
          if [ -f "$BENCHMARK_FILE" ]; then
            echo "$BENCHMARK_FILE already exists. Skipping update."
            echo "should_update=false" >> $GITHUB_OUTPUT
          else
            echo "$BENCHMARK_FILE does not exist. Proceeding with update."
            echo "should_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Run benchmarks
        if: steps.check-version.outputs.should_update == 'true'
        run: uv run --no-sync benchmark --json_output "${{ steps.identity.outputs.file }}"

      - name: Update plots
        if: steps.check-version.outputs.should_update == 'true'
        run: uv run --no-sync plot ./benchmarks/*.json

      - name: Update report
        if: steps.check-version.outputs.should_update == 'true'
        run: uv run --no-sync report "${{ steps.identity.outputs.file }}" --plots ./plots/*.svg

      - name: Compose pull request
        id: pr
        run: |
          # Two independent reasons to open a PR, and either can happen alone:
          # a new SDK on PyPI (lock moves), or a zoo version bump that makes
          # the benchmark file name new (numbers move, lock does not). Say which
          # one this is rather than claiming both.
          SDK="${{ steps.identity.outputs.sdk }}"
          ZOO="${{ steps.identity.outputs.zoo }}"
          BENCHMARKED="${{ steps.check-version.outputs.should_update }}"

          LOCKED=false
          git diff --quiet -- uv.lock || LOCKED=true

          if [ "$BENCHMARKED" = "true" ]; then
            TITLE="Update Benchmarks: Vollo SDK ${SDK}, model zoo ${ZOO}"
          else
            TITLE="Update lock file: Vollo SDK ${SDK}"
          fi

          echo "title=${TITLE}" >> $GITHUB_OUTPUT

          {
            echo "body<<PR_BODY_EOF"
            echo "This is an automated PR from \`update_benchmarks.yml\`."
            echo
            if [ "$LOCKED" = "true" ]; then
              echo "- Locked \`vollo-compiler\` and \`vollo-torch\` to ${SDK}, so \`uv run zoo\` uses it, and raised the declared floor in \`pyproject.toml\` to match"
            fi
            if [ "$BENCHMARKED" = "true" ]; then
              echo "- Added \`${{ steps.identity.outputs.file }}\`, measured by model zoo ${ZOO}"
              echo "- Regenerated plots in \`plots/\`"
              echo "- Updated benchmark report in \`benchmarks/README.md\`"
            else
              echo "- Benchmarks unchanged: \`${{ steps.identity.outputs.file }}\` already exists"
            fi
            if [ "$LOCKED" = "true" ]; then
              echo
              echo "CI on this PR runs the test suite against the newly locked SDK, so a red run here is a real regression in Vollo ${SDK} or in a model's compatibility with it."
            fi
            echo "PR_BODY_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "${{ steps.pr.outputs.title }}"
          title: "${{ steps.pr.outputs.title }}"
          body: "${{ steps.pr.outputs.body }}"
          branch: "automation/vollo-${{ steps.identity.outputs.sdk }}-zoo-${{ steps.identity.outputs.zoo }}"
          base: main
          delete-branch: true
          # No `if:` on this step: the action no-ops when none of these paths
          # changed, which is the "already benchmarked, lock already current"
          # case.
          add-paths: |
            pyproject.toml
            uv.lock
            benchmarks/README.md
            benchmarks/*.json
            plots/*.svg
