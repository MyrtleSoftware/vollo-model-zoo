name: Update Benchmarks

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  update-benchmarks:
    runs-on: self-hosted
    env:
      UV_FIND_LINKS: ${{ github.workspace }}/build/vollo-sdk/python/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Get latest Vollo SDK version
        id: vollo-version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/MyrtleSoftware/vollo-sdk/releases/latest | jq -r .tag_name)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "latest version is ${VERSION}"

      - name: Resolve benchmark identity
        id: identity
        run: |
          # A benchmark run is identified by the SDK it measures *and* the zoo
          # version that defined the models, so a zoo-only change is not
          # mistaken for a run we already have. This builds the same string as
          # `benchmark_version` in vollo_model_zoo/version.py -- keep the two in
          # step. The zoo version comes from pyproject.toml, which is what uv
          # installs the version from (tests/test_version.py checks they agree).
          VERSION=${{ steps.vollo-version.outputs.version }}
          VER_NUM=${VERSION#v}
          ZOO_VER=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "sdk=${VER_NUM}" >> $GITHUB_OUTPUT
          echo "zoo=${ZOO_VER}" >> $GITHUB_OUTPUT
          echo "file=benchmarks/vollo_${VER_NUM}+zoo.${ZOO_VER}.json" >> $GITHUB_OUTPUT
          echo "benchmarking Vollo SDK ${VER_NUM} with model zoo ${ZOO_VER}"

      - name: Check if benchmark already exists
        id: check-version
        run: |
          BENCHMARK_FILE="${{ steps.identity.outputs.file }}"
          if [ -f "$BENCHMARK_FILE" ]; then
            echo "$BENCHMARK_FILE already exists. Skipping update."
            echo "should_update=false" >> $GITHUB_OUTPUT
          else
            echo "$BENCHMARK_FILE does not exist. Proceeding with update."
            echo "should_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Download and extract Vollo SDK
        if: steps.check-version.outputs.should_update == 'true'
        run: |
          VER_NUM=${{ steps.identity.outputs.sdk }}
          SDK_FILE="vollo-sdk-${VER_NUM}.run"
          TAG=${{ steps.vollo-version.outputs.version }}
          URL="https://github.com/MyrtleSoftware/vollo-sdk/releases/download/${TAG}/${SDK_FILE}"

          mkdir -p build
          echo "Downloading $URL ..."
          curl -L -o "build/${SDK_FILE}" "${URL}"

          echo "Extracting $SDK_FILE ..."
          chmod +x "build/${SDK_FILE}"
          ./build/${SDK_FILE} --target build/vollo-sdk --noexec --accept > /dev/null

      - name: Install dependencies
        if: steps.check-version.outputs.should_update == 'true'
        run: |
          uv sync --all-extras --dev \
            --upgrade-package vollo-compiler \
            --upgrade-package vollo-torch \
            --reinstall-package vollo-compiler \
            --reinstall-package vollo-torch

      - name: Check versions
        if: steps.check-version.outputs.should_update == 'true'
        run: uv pip list

      - name: Run benchmarks
        if: steps.check-version.outputs.should_update == 'true'
        run: uv run benchmark --json_output "${{ steps.identity.outputs.file }}"

      - name: Update plots
        if: steps.check-version.outputs.should_update == 'true'
        run: uv run plot ./benchmarks/*.json

      - name: Update report
        if: steps.check-version.outputs.should_update == 'true'
        run: uv run report "${{ steps.identity.outputs.file }}" --plots ./plots/*.svg

      - name: Create Pull Request
        if: steps.check-version.outputs.should_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "benchmarks: update for Vollo SDK ${{ steps.identity.outputs.sdk }}, model zoo ${{ steps.identity.outputs.zoo }}"
          title: "Update Benchmarks: Vollo SDK ${{ steps.identity.outputs.sdk }}, model zoo ${{ steps.identity.outputs.zoo }}"
          body: |
            This is an automated PR to update the benchmarks, plots, and report for Vollo SDK ${{ steps.identity.outputs.sdk }} as measured by model zoo ${{ steps.identity.outputs.zoo }}.

            - Added `${{ steps.identity.outputs.file }}`
            - Regenerated plots in `plots/`
            - Updated benchmark report in `benchmarks/README.md`
          branch: "automation/update-benchmarks-${{ steps.identity.outputs.sdk }}-zoo-${{ steps.identity.outputs.zoo }}"
          base: main
          delete-branch: true
          add-paths: |
            benchmarks/README.md
            benchmarks/*.json
            plots/*.svg
